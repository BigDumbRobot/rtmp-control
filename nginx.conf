# RTMP ingest server for remote performers -> OBS
# After editing: docker compose exec rtmp nginx -s reload   (no one gets disconnected)

worker_processes 1;            # ONE worker handles every stream; avoids auto-push duplication
events { worker_connections 1024; }

rtmp {
  server {
    listen 1935;
    chunk_size 4096;
    ping 30s;                  # detect dead connections faster
    ping_timeout 10s;

    application live {
      live on;
      record off;

      drop_idle_publisher 10s; # clear ghost publishers after a dropout
      wait_key on;             # viewers (OBS) start on a keyframe: no grey smear
      wait_video on;

      # Keys are managed in the admin dashboard (http://localhost:8090).
      # The admin app shares this container's network, so it's at 127.0.0.1:8000.
      notify_method get;
      on_publish      http://127.0.0.1:8000/auth;
      on_publish_done http://127.0.0.1:8000/done;
    }
  }
}

http {
  access_log off;              # stat polling would otherwise spam the log

  # Raw stat page + controls (used by the admin app; also viewable at http://localhost:8080)
  server {
    listen 8080;
    location = /      { return 302 /stat; }
    location = /stat  { rtmp_stat all; rtmp_stat_stylesheet stat.xsl; }
    location = /stat.xsl {
      root /etc/nginx/stat;
      types { text/xsl xsl; }
    }
    location /control { rtmp_control all; }   # used by the "Kick" buttons
  }
}
